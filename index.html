<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウェブサイトを作る時に見る自分用メモ</title>
    <meta name="description" content="いちいち検索するのが面倒なのでよく使うプロパティの使い方などをまとめる">

    <link rel="stylesheet" href="styles/sanitize.css">
    <link rel="stylesheet" href="styles/global.css">
</head>

<body>
    <h1 class="site_title">メモ一覧</h1>
    <p class="site_description">使う機会が多いのになぜか覚えられないものをすぐ見返すためのメモ</p>

    <div class="category_container">
        <button class="category_button" data-category="memo_html">HTML</button>
        <button class="category_button" data-category="memo_css">CSS</button>
        <button class="category_button" data-category="memo_js">JavaScript</button>
        <button class="category_button" data-category="memo_tool">外部ツール</button>
    </div>

    <div class="memo_container">
        <section class="memo_category" id="memo_html"></section>
        <section class="memo_category" id="memo_css"></section>
        <section class="memo_category" id="memo_js"></section>
        <section class="memo_category" id="memo_tool"></section>
    </div>
    <script src="global.js"></script>
</body>
</html>
